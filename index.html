<!doctype html>
<html lang="pt-BR" data-theme="whatsapp">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#008069" />
    <script src="/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" href="/orange_icon_logo_transparent-bg-528x488.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="HNBCRM" />

    <link rel="stylesheet" href="/src/index.css" />
    <!-- O index.html é servido para TODA rota (rewrite do vercel.json), inclusive /f/* (formulários
         dos clientes): as tags estáticas são institucionais e neutras, sem og:url, sem preço/teste.
         A copy de marketing vem do react-helmet na landing (SEO.tsx). data-rh="true" faz o
         react-helmet-async substituir estas tags em vez de duplicar. -->
    <title>HNBCRM</title>
    <meta data-rh="true" name="description" content="HNBCRM: CRM com atendimento por IA no WhatsApp, em que equipe e agentes de IA trabalham juntos." />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="HNBCRM" />
    <meta data-rh="true" property="og:locale" content="pt_BR" />
    <meta data-rh="true" property="og:title" content="HNBCRM" />
    <meta data-rh="true" property="og:description" content="CRM com atendimento por IA no WhatsApp, em que equipe e agentes de IA trabalham juntos." />
    <meta data-rh="true" property="og:image" content="https://hnbcrm.com/icon_logo_white_bg_full-700x700.png" />
    <meta data-rh="true" name="twitter:card" content="summary" />
    <meta data-rh="true" name="twitter:title" content="HNBCRM" />
    <meta data-rh="true" name="twitter:description" content="CRM com atendimento por IA no WhatsApp, em que equipe e agentes de IA trabalham juntos." />
    <meta data-rh="true" name="twitter:image" content="https://hnbcrm.com/icon_logo_white_bg_full-700x700.png" />
    <!-- Demais meta tags por página: react-helmet-async (SEO.tsx) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
